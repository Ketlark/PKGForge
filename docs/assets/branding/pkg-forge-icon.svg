<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">PKG Forge icon</title>
  <desc id="desc">Transparent vector icon showing a package cube and disc ring.</desc>
  <defs>
    <linearGradient id="cubeTop" x1="248" y1="178" x2="768" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="0.48" stop-color="#98A6BE"/>
      <stop offset="1" stop-color="#404A60"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="252" y1="355" x2="520" y2="742" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44506A"/>
      <stop offset="1" stop-color="#0E1420"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="520" y1="365" x2="812" y2="742" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A3347"/>
      <stop offset="1" stop-color="#070B12"/>
    </linearGradient>
    <linearGradient id="blueStroke" x1="146" y1="248" x2="874" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FD6FF"/>
      <stop offset="0.45" stop-color="#2B7CFF"/>
